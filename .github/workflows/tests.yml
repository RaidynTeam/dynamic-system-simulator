name: Windows tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from dss.numerical import make_time_grid, solve_euler, solve_rk4; print('Package import OK')"
      - name: Run tests
        run: python -m pytest -q
